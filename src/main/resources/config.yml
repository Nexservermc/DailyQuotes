hourly-broadcast:
  enabled: true
  # 可用变量：{hour}、{minute}、{time}，也支持 %hour%、%minute%、%time%
  message: "<gold>叮咚！现在是 <yellow>{hour}</yellow> 点整！愿你拥有美好的一小时。</gold>"

join-announcement:
  enabled: true
  messages:
    - "<gradient:gold:yellow>━━━━━━━━━━━━━━━━━━━━━━━━</gradient>"
    - "<gold>欢迎来到服务器！</gold> <gray>祝你游戏愉快，%player_name%！</gray>"
    - "<gradient:gold:yellow>━━━━━━━━━━━━━━━━━━━━━━━━</gradient>"
