# 所有消息支持：
# 1. Bukkit 传统颜色码，例如 &a绿色、&l粗体
# 2. 十六进制颜色，例如 &#FFAA00 或 <#FFAA00>
# 3. MiniMessage，例如 <gradient:gold:yellow>文字</gradient>
# 4. PlaceholderAPI 占位符（安装 PlaceholderAPI 后自动启用）
#
# 每日一言标题/副标题可用占位符：
#   %quote% / {quote}            → 完整名言（句子 + 作者）
#   %quote_sentence% / {quote_sentence} → 名言句子部分
#   %quote_author% / {quote_author}     → 名言作者部分（无名作者时不显示副标题）

daily-message:
  enabled: true
  # 主标题显示名言句子，副标题显示作者
  title: "<gold><bold>%quote_sentence%</bold></gold>"
  subtitle: "<gray>—— %quote_author%</gray>"
  fade-in: 10
  stay: 80
  fade-out: 20
